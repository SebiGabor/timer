name: Deploy Tact PWA la GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build PWA with dynamic GitHub Pages base path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_PAGES_REPO: ${{ format('{0}.github.io', github.repository_owner) }}
        run: |
          if [ "$REPO_NAME" = "$OWNER_PAGES_REPO" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/$REPO_NAME/"
          fi
          echo "Building with VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
